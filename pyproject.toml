[project]
name = "seoul-shield"
version = "0.1.0"
description = "Risk-first AI options agent for the Alpaca AI Trading Agents Hackathon"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
docs = ["reportlab>=4.0", "qrcode[pil]>=7.4"]

[project.scripts]
seoul-shield = "seoul_shield.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
